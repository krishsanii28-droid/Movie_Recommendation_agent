name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, tests, evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Fallback engines: fast, deterministic, no model downloads or API keys.
      EMBEDDING_BACKEND: hashing
      EMOTION_BACKEND: lexicon
      VECTOR_BACKEND: memory
      LLM_BACKEND: none
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Evaluation (dev set) — fails if relevance drops below 0.90
        run: python -m eval.run_eval --out "$RUNNER_TEMP/dev.md" --min-relevance 0.90
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/eval-dev.db
      - name: Evaluation (held-out set) — fails if relevance drops below 0.85
        run: python -m eval.run_eval --prompts eval/heldout.json --out "$RUNNER_TEMP/heldout.md" --min-relevance 0.85
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/eval-heldout.db
      - name: Publish evaluation summary
        if: always()
        run: |
          {
            echo "## Evaluation — dev set"; sed -n '3,13p' "$RUNNER_TEMP/dev.md"
            echo; echo "## Evaluation — held-out set"; sed -n '3,13p' "$RUNNER_TEMP/heldout.md"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · tests, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
