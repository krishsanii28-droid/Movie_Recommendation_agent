[project]
name = "moodreel"
version = "0.1.0"
description = "MoodReel - an AI agent that recommends movies based on how you feel"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["moodreel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
