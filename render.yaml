# Render Blueprint: backend API as a Docker web service.
# Deploy the frontend separately on Vercel/Netlify with VITE_API_BASE_URL set to this service's URL.
services:
  - type: web
    name: moodreel-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: TMDB_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LLM_BACKEND
        value: none            # set to hf_inference once HF_TOKEN is configured
      - key: CORS_ORIGINS
        value: '["https://moodreel.vercel.app"]'   # replace with your frontend URL
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.(vercel\.app|netlify\.app)'
    # The free plan's disk is ephemeral: user feedback/watchlists reset on redeploy.
    # For persistence, use a paid plan with a disk mounted at /app/data, or point
    # DATABASE_URL at a managed PostgreSQL database.
